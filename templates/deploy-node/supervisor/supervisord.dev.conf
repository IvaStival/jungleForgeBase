[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; Vite dev server with HMR. --host 0.0.0.0 so the published port is reachable from the host.
; %(ENV_VITE_PORT)s is supervisord's native env interpolation — the container's own VITE_PORT
; (set by docker-compose.node.dev.yml), so the internal port matches the host-published one.
[program:vite]
command=npm run dev -- --host 0.0.0.0 --port %(ENV_VITE_PORT)s
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
