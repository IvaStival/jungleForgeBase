server {
    listen 8080 default_server;
    server_name _;

    root /var/www/public;
    index index.php;

    client_max_body_size 32M;

    # Trust the host reverse proxy (system nginx) for the real client IP / scheme.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets served directly by nginx.
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif|map)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # php-fpm runs in THIS container, listening on 127.0.0.1:9000.
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 60s;
    }

    location ~ ^/(fpm-status|fpm-ping)$ {
        # nginx and php-fpm share this container; localhost is the only legitimate caller.
        # Do NOT allow the Docker bridge range (172.16/12) — that exposes pool internals to
        # every other project on lion-network.
        allow 127.0.0.1;
        deny all;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
