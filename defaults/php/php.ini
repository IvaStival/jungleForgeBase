[PHP]
expose_php = Off
memory_limit = 256M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 32M
max_input_vars = 5000

; Don't let PHP guess the script from PATH_INFO — avoids feeding FPM a path that doesn't
; map to a real file (defense in depth alongside nginx's `try_files $uri =404`).
cgi.fix_pathinfo = 0

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /proc/self/fd/2

realpath_cache_size = 4M
realpath_cache_ttl = 600

session.cookie_secure = 1
session.cookie_httponly = 1
session.use_strict_mode = 1

[Date]
date.timezone = UTC
