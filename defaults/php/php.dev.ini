[PHP]
expose_php = Off
memory_limit = 512M
max_execution_time = 0
post_max_size = 128M
upload_max_filesize = 128M
max_input_vars = 10000

display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2

[Date]
date.timezone = UTC

[opcache]
; In dev, revalidate files so code edits are picked up immediately.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

[xdebug]
; The xdebug zend_extension is loaded by docker-php-ext-enable; these tune it.
; client_host/client_port are also injected via XDEBUG_CONFIG from compose.
xdebug.mode = develop,debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
