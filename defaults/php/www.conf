[www]
user = www-data
group = www-data

; Bind to loopback only: nginx runs in THIS container and reaches FPM at 127.0.0.1:9000.
; Never 0.0.0.0 — every project shares the external lion-network, so 0.0.0.0 would let any
; neighbor container speak FastCGI directly to FPM (bypassing nginx → arbitrary PHP execution).
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 30
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

pm.status_path = /fpm-status
ping.path = /fpm-ping

; Don't export the container's environment into every PHP worker. Laravel reads config from
; its bind-mounted .env file, so workers don't need (and shouldn't leak) container env vars.
; Set to `no` only if you inject Laravel config via container environment variables.
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
