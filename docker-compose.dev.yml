# Per-project DEV stack — ONE self-contained container (nginx + php-fpm under supervisord).
# Driven by the Makefile:
#   make up <project>          (default env=dev)
#
# Code is volume-mounted from ${PROJECT_PATH}; php + nginx config are mounted from the
# Makefile-resolved paths (project override else jungleforge default) so they're editable
# without a rebuild. nginx's own listen port is templated (default.conf.template) and rendered
# by the entrypoint, since APP_HTTP_PORT is only known at runtime. Backing services (postgres /
# redis / rabbitmq) are the shared stack on lion-network — start them with `make up group=services`.

services:
  app:
    build:
      context: ${PROJECT_PATH}
      dockerfile: ${APP_DOCKERFILE}     # jungleforge's one shared Dockerfile (outside the context)
      target: dev
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    image: ${IMAGE_NAME:-app}:dev
    container_name: ${PHP_CONTAINER:-app-php}
    restart: unless-stopped
    volumes:
      - ${PROJECT_PATH}:/var/www
      - ${PHP_DEV_INI}:/usr/local/etc/php/php.ini:ro
      - ${FPM_POOL}:/usr/local/etc/php-fpm.d/www.conf:ro
      - ${PROJECT_PATH}/deploy/nginx/default.conf.template:/etc/nginx/http.d/default.conf.template:ro
    environment:
      APP_HTTP_PORT: ${APP_HTTP_PORT:-8080}   # nginx's own listen port — entrypoint renders it
                                                # into default.conf from the mounted template
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=${XDEBUG_PORT:-9003}"
      PHP_IDE_CONFIG: "serverName=${IMAGE_NAME:-app}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_HTTP_PORT:-8080}:${APP_HTTP_PORT:-8080}"   # nginx — internal port now matches external
      - "${VITE_PORT:-5173}:5173"         # vite dev server / HMR
    networks:
      lion-network:
        # Other projects reach this one at http://${APP_HOST}:${APP_HTTP_PORT} over the shared
        # network (the in-container port now matches this project's own APP_HTTP_PORT).
        aliases:
          - ${APP_HOST:-app}

networks:
  lion-network:
    external: true
    name: ${NETWORK_NAME:-lion-network}
